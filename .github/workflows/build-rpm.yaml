name: Build and Publish Obsidian RPM

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    outputs:
      skip_build: ${{ steps.check_version.outputs.skip_build }}
      version: ${{ steps.check_version.outputs.version }}
      pkg_rel: ${{ steps.check_version.outputs.pkg_rel }}
    steps:
      - name: Install prerequisite tools
        run: |
          dnf install -y git curl jq wget rpm-build rpm-sign createrepo_c gh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check upstream version and calculate release number
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query changelog.json for desktop releases
          DESKTOP_VERSIONS=$(curl -s https://obsidian.md/changelog.json | jq -r '.items[] | select(.id | contains("desktop-v")) | .id' | grep -oP 'desktop-v\K[0-9]+\.[0-9]+\.[0-9]+')

          LATEST_VERSION=""
          for VER in $DESKTOP_VERSIONS; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -I -L "https://github.com/obsidianmd/obsidian-releases/releases/download/v${VER}/obsidian-${VER}.tar.gz")
            if [ "$HTTP_CODE" = "200" ]; then
              LATEST_VERSION="$VER"
              break
            fi
          done

          if [ -z "$LATEST_VERSION" ]; then
            echo "Error: No public desktop version with downloadable Linux tarball found." >&2
            exit 1
          fi

          echo "Discovered latest available version: $LATEST_VERSION"

          # Check if a release for this version already exists in repo
          if gh release view "v$LATEST_VERSION" > /dev/null 2>&1; then
            echo "Release v$LATEST_VERSION already exists."

            # If this is a cron schedule run, skip build
            if [ "${{ github.event_name }}" == "schedule" ]; then
              echo "Cron run: No new version found. Skipping build."
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # If manually running via workflow_dispatch, bump the release number
            echo "Manual run: Bumping release number."
            HIGHEST_REL=$(gh release view "v$LATEST_VERSION" --json assets -q '.assets[].name' | grep -oP "(?<=${LATEST_VERSION}-)[0-9]+" | sort -n | tail -1 || true)
            if [ -z "$HIGHEST_REL" ]; then
              PKG_REL=1
            else
              PKG_REL=$((HIGHEST_REL + 1))
            fi
          else
            echo "New Obsidian version detected."
            PKG_REL=1
          fi

          echo "Building Version: $LATEST_VERSION, Release: $PKG_REL"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_rel=$PKG_REL" >> "$GITHUB_OUTPUT"
          echo "skip_build=false" >> "$GITHUB_OUTPUT"

          # Download the source tarball
          wget "https://github.com/obsidianmd/obsidian-releases/releases/download/v${LATEST_VERSION}/obsidian-${LATEST_VERSION}.tar.gz"

      - name: Build RPM package
        if: steps.check_version.outputs.skip_build != 'true'
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          PKG_REL="${{ steps.check_version.outputs.pkg_rel }}"

          sed -i "s/^Version:.*/Version:        ${VERSION}/" obsidian.spec
          sed -i "s/^Release:.*/Release:        ${PKG_REL}%{?dist}/" obsidian.spec

          mkdir -p output
          rpmbuild -bb obsidian.spec \
            --define "_sourcedir $PWD" \
            --define "_rpmdir $PWD/output"

      - name: Sign packages and generate repository metadata
        if: steps.check_version.outputs.skip_build != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.check_version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/sign-and-index.sh public/x86_64 output/x86_64 public/RPM-GPG-KEY-obsidian

      - name: Upload RPM to GitHub Releases
        if: steps.check_version.outputs.skip_build != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: Obsidian v${{ steps.check_version.outputs.version }}
          files: |
            output/x86_64/*.rpm
            public/obsidian-repo.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        if: steps.check_version.outputs.skip_build != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    if: needs.build.outputs.skip_build != 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
